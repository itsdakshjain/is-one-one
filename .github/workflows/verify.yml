name: Logic Verification CI

on:
  workflow_run:
    workflows: ["Welcome Bot"] # name of 'welcome.yml'
    types:
      - completed

jobs:
  verify:
    runs-on: ubuntu-latest
    # Only run if the welcome bot succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      pull-requests: write
      contents: read
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Use the repository context from the triggering workflow
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Run Unit Tests
        run: python test_core.py

      - name: Post Comment
        # Since this is a workflow_run, we need to pass the PR number manually
        uses: thollander/actions-comment-pull-request@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          pull_request_number: ${{ github.event.workflow_run.pull_requests[0].number }}
          message: |
            ### ✅ Logic Verified!
            The **Automated Logic Suite** has confirmed that 1 is still 1.
            - **Status:** Mathematical Sanity Confirmed
            
            You are safe to merge this chaos.
